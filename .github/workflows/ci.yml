name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # End-to-end: a real browser against the real API and a real PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: a-long-demo-password-1
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: MundatiC/sentinel-api
          path: sentinel-api
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sentinel-api/package-lock.json
      - name: Start the API
        working-directory: sentinel-api
        run: |
          npm ci
          npx prisma migrate deploy
          npx tsx src/scripts/seed.ts
          # High rate limits and self-registration are for the TEST API only (the suite signs in many times).
          NODE_ENV=development CORS_ORIGINS=http://localhost:3000 PORT=4000 LOGIN_RATE_LIMIT=1000 GLOBAL_RATE_LIMIT=100000 \
            INGEST_RATE_LIMIT=100000 ALLOW_REGISTRATION=true LOG_LEVEL=warn npx tsx src/server.ts &
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: npm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: npx wait-on http://localhost:4000/api/v1/health http://localhost:3000/login --timeout 60000
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sentinel-dashboard .
